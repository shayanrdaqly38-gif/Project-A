<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آزمایش DocSignal</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f2;color:#163e37;font:17px/1.9 system-ui,sans-serif}main{max-width:640px;margin:5vh auto;padding:24px}header{direction:ltr;text-align:right;font-weight:800;color:#267567;letter-spacing:2px}section{background:white;border:1px solid #bcd3cb;padding:20px;border-radius:18px}h1{line-height:1.4}textarea{width:100%;font:16px/1.7 monospace;padding:12px;border:1px solid #64978b;border-radius:8px}button{font:inherit;padding:8px 18px;margin:8px 0;border-radius:10px;border:1px solid #27685b;background:white;color:#16594c}button:first-of-type{background:#16594c;color:white}output{display:block;white-space:pre-line}small{display:block}</style><main><header>DOCSIGNAL / DEMO</header><h1>کدام لینک خراب است؟</h1><p>در این پوشهٔ نمونه فقط دو فایل داریم: <bdi>README.md</bdi> و <bdi>setup.md</bdi>. دکمهٔ بررسی را بزن تا ببینی لینک‌های راهنما به کدام فایل می‌رسند.</p><section><label for="sample">متن راهنمای نمونه</label><textarea id="sample" rows="4" dir="ltr" spellcheck="false">[Start](setup.md)
[Install](setop.md)</textarea><button id="check">بررسی نمونه</button> <button id="fix" hidden>اصلاح اشتباه نمونه</button><output id="result" aria-live="polite"></output></section><small>این نمایش کوچک فقط لینک‌های ساده به نام فایل‌های همین نمونه را بررسی می‌کند. متن از مرورگر شما خارج نمی‌شود.</small></main><script>
const sample=document.querySelector('#sample'),result=document.querySelector('#result'),fix=document.querySelector('#fix');
function check(){const findings=[];let count=0;for(const [i,line] of sample.value.split('\n').entries()){for(const m of line.matchAll(/\[[^\]]*\]\(([\w.-]+)\)/g)){count++;if(!['setup.md','README.md'].includes(m[1]))findings.push(`خط ${i+1}: فایل «${m[1]}» در پوشه نیست.`)}}result.textContent=findings.length?findings.join('\n'):count?'تمام لینک‌های بررسی‌شده به فایل موجود می‌رسند.':'لینکی به نام یک فایل ساده پیدا نشد.';fix.hidden=!sample.value.includes('](setop.md)')}
document.querySelector('#check').onclick=check;fix.onclick=()=>{sample.value=sample.value.replaceAll('](setop.md)','](setup.md)');check()};sample.oninput=()=>{result.textContent='';fix.hidden=true};</script></html>
